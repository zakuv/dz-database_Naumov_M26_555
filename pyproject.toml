[project]
name = "dz-database-naumov-m26-555"
version = "0.1.0"
description = "Простая консольная база данных"
readme = "README.md"
authors = [
    { name = "Mikhail Naumov", email = "mi-n@list.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "prompt>=0.4.1,<0.5.0",
    "prettytable>=3.12.0,<4.0.0",
]

[project.scripts]
database = "primitive_db.main:main"
project = "primitive_db.main:main"

[dependency-groups]
dev = [
    "ruff>=0.16.9,<0.17.0",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "primitive_db"
module-root = "src"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
